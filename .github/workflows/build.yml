name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  test-and-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build: npm run build:mac
          - os: windows-latest
            build: npm run build:win:all
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run setup:models
        continue-on-error: true
      - run: npm run build:renderer
      - run: npm test
        env:
          DUCK_TEST_TIMEOUT_MS: "180000"
      - run: npm run verify:release
        if: startsWith(github.ref, 'refs/tags/v')
      - run: ${{ matrix.build }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: duck-on-desk-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/latest*.yml
          if-no-files-found: error
