name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  test-and-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build: npm run build:mac -- --publish never
          - os: windows-latest
            build: npm run build:win:all -- --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run fetch:policies
      - run: npm run build:renderer
      - run: npm test
        env:
          DUCK_TEST_TIMEOUT_MS: "180000"
      - run: npm run verify:release
        if: startsWith(github.ref, 'refs/tags/v')
      - run: ${{ matrix.build }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: duck-on-desk-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/latest*.yml
          if-no-files-found: error
  release:
    needs: test-and-package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --title "Duck on Desk $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
