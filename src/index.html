<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self'; style-src 'self'; img-src 'self' file:; media-src 'self';">
  <link rel="stylesheet" href="styles.css">
  <title>Duck</title>
</head>
<body>
  <div id="pet-clip">
    <div id="pet-container">
      <div id="pet-facing-stage">
        <div id="pet-motion-stage">
          <div id="pet-asset-direction-stage">
            <div id="pet-media-layer">
              <object id="duck" class="duck-object" type="image/svg+xml"></object>
            </div>
            <div id="pet-accessory-layer">
              <img id="duck-accessory" class="duck-accessory" alt="">
            </div>
            <div id="pet-mouth-accessory-layer">
              <object id="duck-mouth-accessory" class="duck-accessory" type="image/svg+xml"></object>
            </div>
          </div>
        </div>
      </div>
      <div id="pet-effect-stage">
        <div id="pet-particle-layer"></div>
      </div>
    </div>
  </div>
  <script src="pet-accessory-layout.js"></script>
  <script src="pet-accessory-mirror.js"></script>
  <script src="pet-accessory-descriptor.js"></script>
  <script src="pet-visual-swap-policy.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
